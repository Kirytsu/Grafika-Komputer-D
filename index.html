<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Helicopter Simulation</title>
		<style>
			html, body { height: 100%; margin: 0; }
			#app { width: 100%; height: 100%; overflow: hidden; background: #111; position: relative; }
			.overlay { position: absolute; left: 8px; top: 8px; color: #fff; z-index: 1; font-family: Arial, Helvetica, sans-serif; font-size: 13px; }
		</style>
	</head>
	<body>
		<div id="app">
			<div class="overlay">Helicopter Physics Simulation</div>
		</div>

		<!-- Import map: map bare imports like "three" used inside example modules to a full CDN URL -->
		<script type="importmap">
		{
			"imports": {
				"three": "https://unpkg.com/three@0.158.0/build/three.module.js"
			}
		}
		</script>

		<!-- Load the app as an ES module so we can import Three.js examples from CDN -->
		<script type="module" src="./app.js"></script>
	</body>
</html>
